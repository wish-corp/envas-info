<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f5f5f5" rx="8"/>
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">お支払い方法</text>

  <!-- Credit Card -->
  <rect x="20" y="50" width="110" height="60" fill="#fff" stroke="#ddd" rx="4"/>
  <text x="75" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">Credit Card</text>

  <!-- Apple Pay -->
  <rect x="145" y="50" width="110" height="60" fill="#000" rx="4"/>
  <text x="200" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Apple Pay</text>

  <!-- PayPay -->
  <rect x="270" y="50" width="110" height="60" fill="#ff0033" rx="4"/>
  <text x="325" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">PayPay</text>

  <text x="200" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">※ これはサンプル画像です</text>
</svg>
